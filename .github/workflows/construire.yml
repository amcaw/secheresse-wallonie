name: Construire les données

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/construire.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: construire
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --omit=dev

      - run: npm run construire

      - name: Commiter les JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add donnees/etat.json donnees/historique.json
          if git diff --staged --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "Reconstruire les données de sécheresse"
            git pull --rebase origin main
            git push
          fi
